<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello, browser!</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef2ff; color: #18213a; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 480px; padding: 36px; background: white; border-radius: 24px; box-shadow: 0 20px 60px #263b7618; }
      h1 { margin: 0 0 12px; font-size: 32px; }
      p { line-height: 1.6; }
      label { display: block; margin: 24px 0 8px; font-weight: 600; }
      input, button { width: 100%; padding: 14px; border-radius: 10px; font: inherit; }
      input { border: 1px solid #a4aec6; }
      button { margin-top: 12px; border: 0; background: #4f46e5; color: white; font-weight: 600; cursor: pointer; }
      button:hover { background: #4338ca; }
      :focus-visible { outline: 3px solid #818cf8; outline-offset: 3px; }
      #greeting { margin-bottom: 0; font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, browser!</h1>
      <p>Your first JavaScript web app. Enter your name to make it yours.</p>
      <form id="greeting-form">
        <label for="name">Your name</label>
        <input id="name" name="name" placeholder="e.g. Kostas" autocomplete="given-name" maxlength="80">
        <button type="submit">Say hello</button>
      </form>
      <p id="greeting" role="status">Hello, world!</p>
    </main>
    <script>
      document.getElementById("greeting-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const name = document.getElementById("name").value.trim() || "world";
        document.getElementById("greeting").textContent = `Hello, ${name}!`;
      });
    </script>
  </body>
</html>
